name: Build APK

on:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 显式 job 名（GitHub 没有 name 时显示 id `build`）。
    # 刻意**不**写成与 workflow 同名的「Build APK」：那样会重现
    # tests/ciWorkflowNaming.test.mjs 守的那类问题——列表页只显示 workflow 名，
    # 同名会让人以为「整个 workflow 就是这个 job」，失败时指不清环节。
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        run: npm install -g eas-cli@24.8.0

      - name: Check Expo login
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas whoami

      - name: Build Android APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build -p android --profile preview --non-interactive --wait
