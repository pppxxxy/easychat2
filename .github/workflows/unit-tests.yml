name: Unit tests

# 只在手动触发与 PR 时运行：本仓库 main 上会有高频提交，避免每次 push 都排队。
on:
  workflow_dispatch:
  pull_request:

jobs:
  test:
    name: Pure-function unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 用维护中的 LTS：Node 20 已于 2026-04 EOL。
          # 另外这套测试是 .mjs 直接 import src/*.js（ESM 语法、package.json 没有
          # "type": "module"），依赖模块语法检测；22.7+ 默认开启，行为最明确。
          node-version: 22

      # 只覆盖无依赖的纯函数模块（正则引擎 / 世界书匹配 / 密钥脱敏），
      # 所以不需要 npm ci，几秒钟就能跑完。
      - name: Run tests
        run: npm test
