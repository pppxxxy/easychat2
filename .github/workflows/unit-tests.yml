name: Unit tests

# 只在手动触发与 PR 时运行：本仓库 main 上会有高频提交，避免每次 push 都排队。
on:
  workflow_dispatch:
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
           # 与项目开发环境保持一致，使用 Node 20。
           # 测试直接导入 src/*.js，Node 20 的模块语法检测行为稳定。
           node-version: 20

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate Expo config
        run: npx expo config --type public > /dev/null

      - name: Run tests
        run: npm test
