name: Unit tests

# 只在手动触发与 PR 时运行：本仓库 main 上会有高频提交，避免每次 push 都排队。
on:
  workflow_dispatch:
  pull_request:

jobs:
  test:
    name: Pure-function unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 只覆盖无依赖的纯函数模块（正则引擎 / 世界书匹配 / 密钥脱敏），
      # 所以不需要 npm ci，几秒钟就能跑完。
      - name: Run tests
        run: npm test
