# ⚠️ workflow 名必须**概括它下面所有 job**，不能沿用某个 job 的名字。
#
# 这里原名叫 `Unit tests`，但本文件其实跑**两个** job：单元测试 + Kotlin 编译。
# 后果（真实踩到）：GitHub 的 Actions 列表页与提交状态显示的是 **workflow 名**，
# 于是 Kotlin 编译失败时页面显示「Unit tests failed」——
# 看起来像单元测试挂了，实际单元测试一直是绿的（run 279/280/283/284 都是这个假象）。
# 排查时得逐个 job 去翻才知道挂的是哪个环节，而「CI 红了但说不清哪个环节红了」
# 正是本文件里 Kotlin 错误接 check-run annotations 要解决的同一个问题。
#
# 所以改名成能概括全部 job 的 `Tests & Kotlin compile`。
# 名字与文件名（unit-tests.yml）不再一一对应，但**列表页显示的是 name**，
# 那个才是人会看到的东西；文件名改不改都不影响显示，故保持不动以免无谓地
# 改动引用路径（README 等）。job 名各自保留，它们才是精确的那一层。
name: Tests & Kotlin compile

# 手动触发、PR 和 main 关键路径提交时运行。
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'App.js'
      - 'src/**'
      - 'tests/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'assets/**'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.mjs'
      - '.npmrc'
      - '.github/**'
      - 'app.json'
      - 'metro.config.js'
      - 'babel.config.js'

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
            # 与项目开发环境保持一致，使用 Node 22。
            # 测试直接导入 src/*.js，Node 22 的模块语法检测行为稳定。
            node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate Expo config
        run: npx expo config --type public > /dev/null

      - name: Run tests with coverage gate
        run: npm run test:coverage

      - name: Run static checks
        run: npm run lint

      - name: Structure guard
        run: npm run guard:structure

      - name: Export Android bundle
        run: npx expo export --platform android --output-dir /tmp/easychat2-ci-export

  # 只编译 Kotlin，不签名、不打包、不出 APK：插件的 .kt 源码在 prebuild 时才注入 android/，
  # JS 的 lint / node --test 都看不见它们，于是编译错误此前只有「打包」才发现（已两次：
  # 2026-10-12 的 SimpleStringSplitter.asSequence() 二义等）。这个 job 把反馈提前到提交时。
  # 与 test job 并行；代价是一次 Gradle 编译（依赖走 setup-java 的 gradle 缓存）。
  kotlin-compile:
    name: Kotlin compile (prebuild)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Android project
        # 插件的 Kotlin 源码由 config plugin 在此注入 android/，必须先 prebuild 才有东西可编。
        run: npx expo prebuild --platform android --non-interactive --clean

      # ⚠️ 顺序契约：Setup Java（cache: gradle）必须在 prebuild **之后**——android/ 是
      # gitignored 生成物，checkout 时仓库里没有任何 gradle 文件；setup-java 的缓存解析
      # 找不到 **/*.gradle* 会直接报错让本 job 失败（初版把这步排在 prebuild 之前，
      # 自 run 259 引入起每次必红——红叉与代码改动无关）。prebuild 后 gradle 文件就位，缓存才可用。
      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          # Gradle 依赖与 wrapper 走缓存，避免每次 job 全量下载。
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          SDK="$ANDROID_HOME"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || \
          yes | "$SDK/cmdline-tools/20.0/bin/sdkmanager" --licenses 2>/dev/null || true

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Compile release Kotlin
        # 只到 compileReleaseKotlin：不需要 release 签名，也不产生产物，是最小的编译闭环。
        #
        # 为什么要包一层而不是直接 `./gradlew ...`：
        # Gradle 的编译错误只在 **job 日志**里，而 job 日志需要仓库 admin 权限才能下载
        # （无权限时 API 返回 403）。结果是「CI 红了但看不到为什么」——只能靠猜，
        # 本机又没有 JDK 可以复现（仓库既有约束）。这里把 Kotlin 错误行转成
        # `::error::` 工作流命令，GitHub 会把它们放进 **check-run annotations**，
        # 那个接口无需 admin 权限即可读取（`GET /repos/{owner}/{repo}/check-runs/{id}/annotations`）。
        # 于是「CI 红了」这件事重新变得可诊断，而不是只有 admin 才看得见。
        working-directory: android
        run: |
          set +e
          ./gradlew :app:compileReleaseKotlin --no-daemon --stacktrace 2>&1 | tee /tmp/kotlin-compile.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Kotlin 编译错误形如 `e: file:///path/Foo.kt:12:5 message`；
            # 同时把 `FAILURE:` / `What went wrong` 段也带出来（配置/依赖类错误没有 e: 行）。
            emit=$(grep -E "^e: |^w: .*\.kt|What went wrong|^FAILURE:|Could not (resolve|find|determine)" /tmp/kotlin-compile.log | head -60)
            if [ -z "$emit" ]; then
              emit=$(tail -60 /tmp/kotlin-compile.log)
            fi
            printf '%s\n' "$emit" | while IFS= read -r line; do
              # 注解里的 % 需要转义，否则 GitHub 解析工作流命令会出错
              safe=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r//g')
              echo "::error::$safe"
            done
          fi
          exit "$status"
