name: Unit tests

# 手动触发、PR 和 main 关键路径提交时运行。
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.github/**'
      - 'app.json'
      - 'metro.config.js'
      - 'babel.config.js'

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
            # 与项目开发环境保持一致，使用 Node 22。
            # 测试直接导入 src/*.js，Node 22 的模块语法检测行为稳定。
            node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate Expo config
        run: npx expo config --type public > /dev/null

      - name: Run tests
        run: npm test
