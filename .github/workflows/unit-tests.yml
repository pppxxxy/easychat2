name: Unit tests

# 手动触发、PR 和 main 关键路径提交时运行。
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'App.js'
      - 'src/**'
      - 'tests/**'
      - 'plugins/**'
      - 'assets/**'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.mjs'
      - '.npmrc'
      - '.github/**'
      - 'app.json'
      - 'metro.config.js'
      - 'babel.config.js'

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
            # 与项目开发环境保持一致，使用 Node 22。
            # 测试直接导入 src/*.js，Node 22 的模块语法检测行为稳定。
            node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate Expo config
        run: npx expo config --type public > /dev/null

      - name: Run tests with coverage gate
        run: npm run test:coverage

      - name: Run static checks
        run: npm run lint

      - name: Export Android bundle
        run: npx expo export --platform android --output-dir /tmp/easychat2-ci-export
