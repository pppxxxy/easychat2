name: Build APK on GitHub

on:
  workflow_dispatch:

concurrency:
  group: build-apk-github-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK without EAS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          SDK="$ANDROID_HOME"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || \
          yes | "$SDK/cmdline-tools/20.0/bin/sdkmanager" --licenses 2>/dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Configure preview release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('android/app/build.gradle')
          text = gradle.read_text()
          updated, count = re.subn(
              r'(release\s*\{(?:[^{}]|\{[^{}]*\})*?)signingConfig\s+signingConfigs\.\w+',
              r'\1signingConfig signingConfigs.debug',
              text,
              count=1,
              flags=re.S,
          )
          if count == 0:
              updated = text.replace(
                  'release {',
                  'release {\n            signingConfig signingConfigs.debug',
                  1,
              )
          gradle.write_text(updated)

          props = Path('android/gradle.properties')
          extra = 'org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m\n'
          current = props.read_text() if props.exists() else ''
          if 'org.gradle.jvmargs' not in current:
              props.write_text(current + extra)
          PY

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: easychat2-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
