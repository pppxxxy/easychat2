name: Build APK on GitHub

on:
  workflow_dispatch:

concurrency:
  group: build-apk-github-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK without EAS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Configure preview release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('android/app/build.gradle')
          text = gradle.read_text()
          updated, count = re.subn(
              r'(release\s*\{(?:[^{}]|\{[^{}]*\})*?)signingConfig\s+signingConfigs\.\w+',
              r'\1signingConfig signingConfigs.debug',
              text,
              count=1,
              flags=re.S,
          )
          if count == 0:
              updated = text.replace(
                  'release {',
                  'release {\n            signingConfig signingConfigs.debug',
                  1,
              )
          gradle.write_text(updated)

          props = Path('android/gradle.properties')
          extra = 'org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m\n'
          current = props.read_text() if props.exists() else ''
          if 'org.gradle.jvmargs' not in current:
              props.write_text(current + extra)
          PY

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: easychat2-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
