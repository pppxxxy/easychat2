<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c1322">
<title>贪吃蛇大作战·单机版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0c1322;
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft Yahei',sans-serif;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas#game{position:fixed;inset:0;display:block}
.hidden{display:none!important}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#stats{position:absolute;left:10px;top:calc(10px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px}
.pill{background:rgba(10,18,35,.6);border:1px solid rgba(120,150,220,.25);color:#cdd8ee;
  font-size:13px;font-weight:600;padding:5px 12px;border-radius:20px;backdrop-filter:blur(4px);width:max-content}
.pill b{color:#ffdd59}
#minimap{position:absolute;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));width:110px;height:110px;
  border-radius:50%;background:rgba(8,14,28,.7);border:1px solid rgba(255,70,80,.5)}
#toasts{position:absolute;top:calc(72px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:rgba(200,40,60,.88);color:#fff;padding:6px 16px;border-radius:20px;font-size:13px;
  font-weight:600;white-space:nowrap;animation:tIn .25s ease,tOut .4s ease 1.6s forwards}
@keyframes tIn{from{transform:translateY(-16px);opacity:0}}
@keyframes tOut{to{transform:translateY(-10px);opacity:0}}
#joyBase{position:fixed;width:110px;height:110px;border-radius:50%;
  border:2px solid rgba(140,170,255,.35);background:rgba(20,30,60,.25);
  z-index:9;left:16px;bottom:24px;display:none}
#joyKnob{position:absolute;left:50%;top:50%;width:48px;height:48px;border-radius:50%;
  background:rgba(140,170,255,.55);border:2px solid rgba(200,220,255,.7);
  transform:translate(-50%,-50%);transition:transform .05s linear}
#boost{position:fixed;right:20px;bottom:36px;width:82px;height:82px;border-radius:50%;
  background:rgba(20,30,60,.5);border:2px solid rgba(120,150,220,.35);
  display:none;align-items:center;justify-content:center;font-size:13px;font-weight:700;
  color:#8fb3ff;z-index:9;letter-spacing:2px;user-select:none;touch-action:none}
#boost.active{background:rgba(74,144,217,.6);color:#fff;box-shadow:0 0 16px rgba(74,144,217,.7)}
#startScreen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:13px;padding:20px;
  background:radial-gradient(ellipse at 50% 30%,rgba(27,42,77,.92) 0%,rgba(12,19,34,.97) 70%)}
#startScreen h1{color:#ffdd59;font-size:32px;font-weight:900;letter-spacing:3px;
  text-shadow:0 2px 0 #b8860b,0 4px 12px rgba(0,0,0,.6)}
#startBtn{margin-top:8px;padding:13px 54px;font-size:19px;font-weight:900;color:#fff;letter-spacing:3px;
  border:none;border-radius:34px;cursor:pointer;
  background:linear-gradient(180deg,#7ed957,#4caf50 60%,#3d8b40);
  box-shadow:0 5px 0 #2d6b30,0 8px 18px rgba(0,0,0,.45);font-family:inherit}
#startBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #2d6b30}
.best{color:#8fb3ff;font-size:13px}
.tips{color:rgba(200,215,240,.55);font-size:12px;text-align:center;line-height:1.8}
.tips b{color:#ffdd59}
#deathScreen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(5,10,20,.7)}
#deathScreen .panel{width:min(84vw,320px);display:flex;flex-direction:column;gap:12px;align-items:center;
  background:linear-gradient(180deg,#16233f,#0e1830);border:2px solid rgba(120,150,220,.3);border-radius:18px;padding:24px 22px}
.deadTitle{color:#ff6b6b;font-size:26px;font-weight:900}
#deathStats{width:100%;display:flex;flex-direction:column;gap:6px}
#deathStats .row{display:flex;justify-content:space-between;color:#cdd8ee;font-size:14px}
#deathStats .row b{color:#ffdd59}
#retryBtn{width:100%;padding:12px;font-size:16px;font-weight:900;color:#fff;letter-spacing:2px;border:none;
  border-radius:26px;background:linear-gradient(180deg,#7ed957,#4caf50 60%,#3d8b40);box-shadow:0 4px 0 #2d6b30;
  font-family:inherit}
#retryBtn:active{transform:translateY(2px);box-shadow:0 2px 0 #2d6b30}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="joyBase"><div id="joyKnob"></div></div>
<div id="boost">加速</div>
<div id="hud" class="hidden">
  <div id="stats">
    <div class="pill">长度 <b id="statLen">10</b></div>
    <div class="pill">排名 <b id="statRank">#-</b></div>
    <div class="pill">击杀 <b id="statKill">0</b></div>
  </div>
  <canvas id="minimap" width="220" height="220"></canvas>
  <div id="toasts"></div>
</div>
<div id="startScreen">
  <h1>贪吃蛇大作战</h1>
  <div class="best" id="bestText"></div>
  <button id="startBtn">开 始 游 戏</button>
  <div class="tips">
    左下摇杆控制方向 · 右下按钮加速<br>
    加速消耗长度掉食物 · 撞墙会沿墙滑<br>
    自己撞自己不会死 · 撞别的蛇头会死<br>
    长度无上限 · 蛇口自动吸附附近食物<br>
    <b>护盾</b>抵挡一次致命撞击
  </div>
</div>
<div id="deathScreen" class="hidden">
  <div class="panel">
    <div class="deadTitle">你挂了！</div>
    <div id="deathStats">
      <div class="row"><span>本局长度</span><b id="dLen">0</b></div>
      <div class="row"><span>击杀数量</span><b id="dKill">0</b></div>
      <div class="row"><span>最高排名</span><b id="dRank">#-</b></div>
      <div class="row"><span>历史最佳</span><b id="dBest">0</b></div>
    </div>
    <button id="retryBtn">再来一局</button>
  </div>
</div>
<script>
'use strict';
const TAU = Math.PI * 2;
const MAP_R = 3400;
const AI_COUNT = 16;
const FOOD_MAX = 1500;
const BASE_SPEED = 130;
const BOOST_SPEED = 230;
const GRID = 160;
const MAX_RADIUS = 14;
const BASE_RADIUS = 6.5;
const GROW_PER_FOOD = 0.05;
const SPAWN_INVULN = 2.2;
const SHIELD_INVULN = 1.3;
const EAT_PULL_BASE = 190;
const EAT_PULL_PER_R = 3.5;
const FOOD_EDGE_MARGIN = 30;

const rand = (a,b) => a + Math.random() * (b-a);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const dist2 = (x1,y1,x2,y2) => { const dx=x2-x1, dy=y2-y1; return dx*dx+dy*dy; };
const angNorm = a => { while(a>Math.PI) a-=TAU; while(a<-Math.PI) a+=TAU; return a; };

const $ = id => document.getElementById(id);
const cv = $('game'), ctx = cv.getContext('2d');
const mm = $('minimap'), mctx = mm.getContext('2d');
const hud = $('hud'), startScreen = $('startScreen'), deathScreen = $('deathScreen');
const statLen = $('statLen'), statRank = $('statRank'), statKill = $('statKill');
const toastsEl = $('toasts'), bestText = $('bestText');
const joyBase = $('joyBase'), joyKnob = $('joyKnob'), boostBtn = $('boost');

let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
}
addEventListener('resize', resize); resize();

/* 食物空间网格 */
const foodGrid = new Map();
let foodCount = 0;
const cellKey = (cx,cy) => cx * 100003 + cy;
function addFood(f){
  f._cx = Math.floor(f.x / GRID);
  f._cy = Math.floor(f.y / GRID);
  const k = cellKey(f._cx, f._cy);
  let arr = foodGrid.get(k);
  if(!arr){ arr = []; foodGrid.set(k, arr); }
  f._i = arr.length; f._arr = arr; arr.push(f);
}
function removeFood(f){
  const arr = f._arr, last = arr.pop();
  if(last !== f){ arr[f._i] = last; last._i = f._i; }
}
function foodMove(f){
  const cx = Math.floor(f.x / GRID), cy = Math.floor(f.y / GRID);
  if(cx === f._cx && cy === f._cy) return;
  removeFood(f);
  f._cx = cx; f._cy = cy;
  const k = cellKey(cx, cy);
  let arr = foodGrid.get(k);
  if(!arr){ arr = []; foodGrid.set(k, arr); }
  f._i = arr.length; f._arr = arr; arr.push(f);
}
function clampToMap(x, y, margin){
  const m = margin == null ? FOOD_EDGE_MARGIN : margin;
  const dr = Math.hypot(x, y);
  const maxR = MAP_R - m;
  if(dr > maxR && dr > 0.0001){
    const k = maxR / dr;
    return [x * k, y * k];
  }
  return [x, y];
}
function spawnFood(x, y, value, color, big){
  if(foodCount > FOOD_MAX + 1000) return;
  const p = clampToMap(x, y);
  const f = {
    x: p[0], y: p[1], value,
    r: 2.4 + Math.min(value, 8) * 0.85,
    color, big: !!big,
    phase: Math.random() * TAU
  };
  addFood(f); foodCount++;
}
function eatFood(f){ removeFood(f); foodCount--; }
function queryFoods(x, y, r, out){
  out.length = 0;
  const c0x = Math.floor((x-r)/GRID), c1x = Math.floor((x+r)/GRID);
  const c0y = Math.floor((y-r)/GRID), c1y = Math.floor((y+r)/GRID);
  for(let cy=c0y; cy<=c1y; cy++)
    for(let cx=c0x; cx<=c1x; cx++){
      const arr = foodGrid.get(cellKey(cx, cy));
      if(arr) for(let i=0;i<arr.length;i++) out.push(arr[i]);
    }
  return out;
}
const randFoodColor = () => 'hsl(' + ((Math.random()*360)|0) + ',85%,62%)';
function initFoods(n){
  for(let i=0;i<n;i++){
    const a = rand(0, TAU), r = Math.sqrt(Math.random()) * (MAP_R - 100);
    spawnFood(Math.cos(a)*r, Math.sin(a)*r, 1 + ((Math.random()*3)|0), randFoodColor(), false);
  }
}

const PALETTE = ['#E74C3C','#E67E22','#F1C40F','#2ECC71','#1ABC9C','#3498DB','#9B59B6','#E91E63','#FF5722','#00BCD4'];
const randomColor = () => PALETTE[(Math.random()*PALETTE.length)|0];
let items = [];
let itemTimer = 0;

/* 蛇 */
let snakeSeq = 0;
class Snake {
  constructor(o){
    this.id = ++snakeSeq;
    this.isPlayer = !!o.isPlayer;
    this.color = o.color || (this.isPlayer ? '#4A90D9' : randomColor());
    this.name = o.name || '';
    this.x = o.x; this.y = o.y;
    this.angle = o.angle != null ? o.angle : Math.random() * TAU;
    this.targetAngle = null;
    this.length = o.length || 10;
    this.radius = BASE_RADIUS;
    this.headR = BASE_RADIUS * 1.3;
    this.dead = false;
    this.kills = 0;
    this.bestRank = 99;
    this.invincible = SPAWN_INVULN;
    this.boost = false;
    this.boostTimer = 0;
    this.dropTimer = 0;
    this.decideTimer = Math.random() * 0.2;
    this.wander = this.angle;
    this.shield = false;
    this.aiRatio = o.aiRatio || 0;
    this.growRate = o.growRate || 1.2;
    this.path = [];
    this.body = [];
    this.bbox = { minX:0, minY:0, maxX:0, maxY:0 };

    const n = this.bodyCount() + 2;
    const sp = this.spacingNow();
    for(let i=n; i>=0; i--){
      this.path.push({
        x: this.x - Math.cos(this.angle) * sp * i,
        y: this.y - Math.sin(this.angle) * sp * i
      });
    }
    this.recompute();
  }
  targetRadius(){ return clamp(BASE_RADIUS + Math.sqrt(this.length) * 0.26, BASE_RADIUS, MAX_RADIUS); }
  bodyCount(){ return 6 + Math.floor(this.length * 0.9); }
  spacingNow(){ return Math.max(3.5, this.radius * 0.5); }

  recompute(){
    const sp = this.spacingNow(), need = this.bodyCount();
    const path = this.path, body = this.body;
    let bi = 0;
    const set = (x, y) => {
      let p = body[bi];
      if(!p){ p = { x:0, y:0 }; body[bi] = p; }
      p.x = x; p.y = y; bi++;
    };
    if(path.length) set(path[0].x, path[0].y);
    else set(this.x, this.y);

    let minX=this.x, maxX=this.x, minY=this.y, maxY=this.y;
    let distNeed = sp;
    let segX = path[0].x, segY = path[0].y;

    for(let i=1;i<path.length && bi<need;i++){
      const p = path[i];
      let dx = p.x - segX, dy = p.y - segY;
      let seg = Math.hypot(dx, dy);
      while(seg >= distNeed && bi < need){
        const t = distNeed / seg;
        const nx = segX + dx * t, ny = segY + dy * t;
        set(nx, ny);
        if(nx<minX)minX=nx; if(nx>maxX)maxX=nx;
        if(ny<minY)minY=ny; if(ny>maxY)maxY=ny;
        segX = nx; segY = ny;
        dx = p.x - nx; dy = p.y - ny;
        seg = Math.hypot(dx, dy);
        distNeed = sp;
      }
      distNeed -= seg;
      segX = p.x; segY = p.y;
    }
    const last = body[bi-1];
    while(bi < need){ set(last.x, last.y); bi++; }
    body.length = need;

    this.bbox.minX = minX - this.radius;
    this.bbox.maxX = maxX + this.radius;
    this.bbox.minY = minY - this.radius;
    this.bbox.maxY = maxY + this.radius;
  }

  trimPath(){
    const total = this.bodyCount() * this.spacingNow() + this.spacingNow() * 3;
    let acc = 0;
    const path = this.path;
    for(let i=1;i<path.length;i++){
      acc += Math.hypot(path[i].x - path[i-1].x, path[i].y - path[i-1].y);
      if(acc > total){ path.length = i + 1; return; }
    }
  }

  update(dt){
    if(this.invincible > 0) this.invincible -= dt;

    if(this.targetAngle != null){
      const diff = angNorm(this.targetAngle - this.angle);
      const maxTurn = Math.max(2.5, 5.0 - this.radius * 0.1) * dt;
      this.angle += clamp(diff, -maxTurn, maxTurn);
    }

    let boosting = false;
    if(this.isPlayer){
      boosting = input.boost && this.length > 20;
    }else{
      if(this.boostTimer > 0) this.boostTimer -= dt;
      boosting = this.boostTimer > 0 && this.length > 25;
    }
    this.boost = boosting;

    const sp = boosting ? BOOST_SPEED : BASE_SPEED;
    let nx = this.x + Math.cos(this.angle) * sp * dt;
    let ny = this.y + Math.sin(this.angle) * sp * dt;

    // ★ 用 headR 做边界限制，视觉上不会越界
    const dr = Math.hypot(nx, ny);
    const maxR = MAP_R - this.headR;
    if(dr > maxR){
      const k = maxR / dr;
      nx *= k; ny *= k;
    }
    this.x = nx; this.y = ny;

    if(boosting){
      this.length = Math.max(10, this.length - 12 * dt);
      this.dropTimer -= dt;
      if(this.dropTimer <= 0){
        this.dropTimer = 0.16;
        const tail = this.body[this.body.length - 1] || this;
        spawnFood(
          tail.x + rand(-4,4),
          tail.y + rand(-4,4),
          1, this.color, false
        );
      }
    }

    const tr = this.targetRadius();
    this.radius += (tr - this.radius) * Math.min(1, dt * 3);
    this.headR = this.radius * 1.3;

    const h = this.path[0];
    if(!h) this.path.unshift({ x:this.x, y:this.y });
    else if(dist2(h.x, h.y, this.x, this.y) < 0.36){ h.x = this.x; h.y = this.y; }
    else this.path.unshift({ x:this.x, y:this.y });

    this.trimPath();
    this.recompute();
  }
}

/* AI */
const _qa = [];
function aiThink(s, dt){
  s.decideTimer -= dt;
  if(s.decideTimer > 0) return;
  s.decideTimer = 0.12 + Math.random() * 0.1;

  const look = 90 + s.radius * 7;
  const test = ang => {
    const x = s.x + Math.cos(ang) * look;
    const y = s.y + Math.sin(ang) * look;
    if(Math.hypot(x, y) > MAP_R - 100) return false;
    const safe = s.radius * 2.2;
    for(const o of snakes){
      if(o === s || o.dead) continue;
      const bb = o.bbox;
      if(x < bb.minX - safe || x > bb.maxX + safe ||
         y < bb.minY - safe || y > bb.maxY + safe) continue;
      const rr = safe + o.radius, rr2 = rr * rr;
      const b = o.body;
      for(let i=0; i<b.length; i++)
        if(dist2(x, y, b[i].x, b[i].y) < rr2) return false;
    }
    return true;
  };

  if(!test(s.angle)){
    const offs = [0.55, -0.55, 1.1, -1.1, 1.8, -1.8, 2.6, -2.6];
    let found = null;
    for(const off of offs) if(test(s.angle + off)){ found = s.angle + off; break; }
    s.targetAngle = found != null ? found : Math.atan2(-s.y, -s.x);
    return;
  }

  const foods = queryFoods(s.x, s.y, 420, _qa);
  let best = null, bs = 0;
  for(let i=0; i<foods.length; i++){
    const f = foods[i];
    const d = Math.hypot(f.x - s.x, f.y - s.y) + 1;
    const v = f.value / d;
    if(v > bs){ bs = v; best = f; }
  }
  if(best) s.targetAngle = Math.atan2(best.y - s.y, best.x - s.x);
  else{
    s.wander += rand(-0.6, 0.6);
    if(Math.hypot(s.x + Math.cos(s.wander) * 600, s.y + Math.sin(s.wander) * 600) > MAP_R - 200)
      s.targetAngle = Math.atan2(-s.y, -s.x);
    else s.targetAngle = s.wander;
  }
  if(s.length > 60 && Math.random() < 0.015) s.boostTimer = rand(0.4, 1);
}

/* 世界状态 */
let gameState = 'menu';
let player = null;
let snakes = [];
let respawnQueue = [];
let cam = { x:0, y:0 };
let zoom = 0.7;
let tNow = 0, hudTimer = 0, foodSpawnTimer = 0;
let bestLen = 0;
try { bestLen = +localStorage.getItem('snake_best_v11') || 0; } catch(e){}

function assignAIRatio(){
  const r = Math.random();
  if(r < 0.15) return 0.20 + Math.random() * 0.15;
  if(r < 0.50) return 0.08 + Math.random() * 0.10;
  return 0.02 + Math.random() * 0.06;
}

function safeSpawn(){
  for(let t=0; t<30; t++){
    const a = rand(0, TAU), r = Math.sqrt(Math.random()) * (MAP_R - 500);
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    let ok = true;
    for(const s of snakes)
      if(!s.dead && dist2(x, y, s.x, s.y) < 350*350){ ok = false; break; }
    if(ok) return [x, y];
  }
  const a = rand(0, TAU), r = Math.sqrt(Math.random()) * (MAP_R - 800);
  return [Math.cos(a) * r, Math.sin(a) * r];
}

function spawnAI(initialLength){
  let pos = safeSpawn();
  let x = pos[0], y = pos[1];
  const dr = Math.hypot(x, y);
  const maxR = MAP_R - 300;
  if(dr > maxR){
    const k = maxR / dr;
    x *= k; y *= k;
  }

  const ratio = assignAIRatio();
  const p = Math.max(10, player ? player.length : 10);
  let len = initialLength;
  if(len == null){
    len = Math.max(12, Math.floor(p * ratio * rand(0.5, 1.0)));
  }
  const s = new Snake({
    isPlayer: false, x, y, length: len, aiRatio: ratio,
    growRate: 1.5 + ratio * 25
  });
  snakes.push(s);
}

function setupMenuWorld(){
  snakes.length = 0; respawnQueue.length = 0;
  foodGrid.clear(); foodCount = 0;
  items.length = 0; itemTimer = 0;
  for(let i=0; i<AI_COUNT; i++) spawnAI(rand(30, 200));
  initFoods(800);
  cam.x = 0; cam.y = 0; zoom = 0.7;
  gameState = 'menu';
  startScreen.classList.remove('hidden');
  deathScreen.classList.add('hidden');
  hud.classList.add('hidden');
  joyBase.style.display = 'none';
  boostBtn.style.display = 'none';
  bestText.textContent = bestLen > 0 ? '历史最佳长度：' + bestLen : '';
}

function startGame(){
  snakes.length = 0; respawnQueue.length = 0;
  foodGrid.clear(); foodCount = 0;
  items.length = 0; itemTimer = 0;

  const [px, py] = safeSpawn();
  player = new Snake({
    isPlayer: true, x: px, y: py,
    length: 12, color: '#4A90D9'
  });
  snakes.push(player);

  for(let i=0; i<AI_COUNT; i++) spawnAI(rand(20, 160));
  initFoods(800);

  cam.x = px; cam.y = py; zoom = 1.15;
  gameState = 'play';
  startScreen.classList.add('hidden');
  deathScreen.classList.add('hidden');
  hud.classList.remove('hidden');
  joyBase.style.display = 'block';
  boostBtn.style.display = 'flex';
  hudTimer = 0;
  updateHUD();
}

/* 击杀 */
function kill(s, killer){
  if(s.dead) return;
  s.dead = true;
  if(killer && !killer.dead) killer.kills++;
  if(killer === player){ toast('你击败了对手！'); sfx.kill(); }

  const b = s.body;
  const step = Math.max(1, Math.ceil(b.length / 45));
  const per = clamp(s.length / Math.max(1, (b.length/step)|0), 1, 10);
  for(let k=0; k<b.length; k+=step){
    spawnFood(
      b[k].x + rand(-s.radius, s.radius) * 0.6,
      b[k].y + rand(-s.radius, s.radius) * 0.6,
      per, s.color, true
    );
  }

  if(s === player){
    sfx.die();
    gameState = 'dead';
    setTimeout(showDeath, 900);
  }else{
    respawnQueue.push(tNow + rand(2, 4));
  }
}

function showDeath(){
  if(gameState !== 'dead') return;
  const len = Math.round(player.length);
  if(len > bestLen){
    bestLen = len;
    try { localStorage.setItem('snake_best_v11', bestLen); } catch(e){}
  }
  $('dLen').textContent = len;
  $('dKill').textContent = player.kills;
  $('dRank').textContent = '#' + player.bestRank;
  $('dBest').textContent = bestLen;
  deathScreen.classList.remove('hidden');
}

function toast(txt){

/* 音效 */
let audioCtx = null, muted = false;
function initAudio(){
  if(!audioCtx){ try { audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} }
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(f1, f2, dur, type, vol){
  if(muted || !audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f1, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  eat: () => beep(rand(500,900), rand(700,1100), 0.06, 'triangle', 0.05),
  kill: () => { beep(500,900,0.12,'square',0.07); setTimeout(()=>beep(700,1300,0.15,'square',0.07),90); },
  die: () => beep(280,60,0.5,'sawtooth',0.12),
  item: () => beep(700,1400,0.15,'sine',0.08)
};

/* 碰撞 */
function collisions(){
  for(const s of snakes){
    if(s.dead) continue;
    if(Math.hypot(s.x, s.y) > MAP_R - s.headR * 0.5) kill(s, null);
  }
  for(let i=0; i<snakes.length; i++){
    const a = snakes[i];
    if(a.dead || a.invincible > 0) continue;
    for(let j=0; j<snakes.length; j++){
      if(i === j) continue;
      const b = snakes[j];
      if(b.dead || b.invincible > 0) continue;

      const bb = b.bbox, m = a.radius;
      if(a.x < bb.minX - m || a.x > bb.maxX + m ||
         a.y < bb.minY - m || a.y > bb.maxY + m) continue;

      const rr = a.radius * 0.55 + b.radius;
      const rr2 = rr * rr;
      const body = b.body;
      let hit = false;
      const bodyStep = body.length > 200 ? 2 : 1;
      for(let k=0; k<body.length; k+=bodyStep){
        if(dist2(a.x, a.y, body[k].x, body[k].y) < rr2){ hit = true; break; }
      }
      if(hit){
        if(a.isPlayer && a.shield){
          a.shield = false;
          a.invincible = SHIELD_INVULN;
          const pa = Math.atan2(a.y - b.y, a.x - b.x);
          a.x += Math.cos(pa) * 28;
          a.y += Math.sin(pa) * 28;
          const dr = Math.hypot(a.x, a.y);
          const mr = MAP_R - a.headR;
          if(dr > mr){ const kk = mr/dr; a.x *= kk; a.y *= kk; }
        }else{
          kill(a, b);
        }
        break;
      }
    }
  }
}

/* 主更新 */
const _qb = [];
function update(dt){
  tNow += dt;

  for(const s of snakes){
    if(s.dead) continue;
    if(!s.isPlayer) aiThink(s, dt);
    s.update(dt);
  }

  if(player && !player.dead){
    const p = player.length;
    for(const s of snakes){
      if(s.dead || s.isPlayer) continue;
      if(s.aiRatio <= 0) continue;
      const target = Math.max(12, Math.floor(p * s.aiRatio));
      if(s.length < target){
        s.length = Math.min(target, s.length + dt * s.growRate);
      }
    }
  }

  for(const s of snakes){
    if(s.dead) continue;
    const foods = queryFoods(s.x, s.y, 90 + s.radius * 2.5, _qb);
    let pullR;
    if(s.isPlayer){
      pullR = EAT_PULL_BASE + s.radius * EAT_PULL_PER_R;
    }else{
      pullR = 110 + s.radius * 2.2;
    }
    for(let i=0; i<foods.length; i++){
      const f = foods[i];
      const dx = s.x - f.x, dy = s.y - f.y;
      const d = Math.hypot(dx, dy) || 0.001;
      if(d < s.radius + f.r + 2){
        s.length += f.value;
        s.radius = Math.min(MAX_RADIUS, s.radius + GROW_PER_FOOD);
        eatFood(f);
        if(s.isPlayer) sfx.eat();
      }else if(d < pullR){
        const pull = (520 + (pullR - d) * 4) * dt;
        const mv = Math.min(pull, d - 1) / d;
        f.x += dx * mv; f.y += dy * mv;
        // ★ 磁吸移动后也要强制 clamp 在地图内
        const p = clampToMap(f.x, f.y);
        f.x = p[0]; f.y = p[1];
        foodMove(f);
      }
    }
  }

  if(player && !player.dead){
    for(let i=items.length-1; i>=0; i--){
      const it = items[i];
      if(Math.hypot(player.x - it.x, player.y - it.y) < player.headR + it.r + 4){
        player.shield = true;
        items.splice(i, 1);
        sfx.item();
      }
    }
  }

  collisions();

  while(respawnQueue.length && respawnQueue[0] < tNow){
    respawnQueue.shift();
    spawnAI();
  }

  itemTimer -= dt;
  if(itemTimer <= 0 && items.length < 2 && player){
    itemTimer = 6;
    spawnItem();
  }

  foodSpawnTimer -= dt;
  if(foodSpawnTimer <= 0){
    foodSpawnTimer = 0.25;
    for(let i=0; i<4; i++){
      if(foodCount < FOOD_MAX){
        const a = rand(0, TAU);
        const r = Math.sqrt(Math.random()) * (MAP_R - 100);
        spawnFood(Math.cos(a)*r, Math.sin(a)*r, 1 + ((Math.random()*3)|0), randFoodColor(), false);
      }
    }
  }

  for(let i=snakes.length-1; i>=0; i--) if(snakes[i].dead) snakes.splice(i, 1);

  // ★ 镜头缩放跟随长度动态拉远
  if(player && !player.dead && gameState === 'play'){
    cam.x += (player.x - cam.x) * Math.min(1, dt * 6);
    cam.y += (player.y - cam.y) * Math.min(1, dt * 6);
    // 长度越长，镜头越远（下限 0.5）
    const zt = clamp(1.4 - Math.min(player.length / 1000, 1) * 0.8, 0.5, 1.2);
    zoom += (zt - zoom) * Math.min(1, dt * 2);
  }else if(gameState === 'menu'){
    let big = null;
    for(const s of snakes) if(!s.dead && (!big || s.length > big.length)) big = s;
    if(big){
      cam.x += (big.x - cam.x) * Math.min(1, dt * 0.8);
      cam.y += (big.y - cam.y) * Math.min(1, dt * 0.8);
    }
  }

  if(gameState === 'play' && player && !player.dead){
    hudTimer -= dt;
    if(hudTimer <= 0){ hudTimer = 0.3; updateHUD(); }
  }
}

function spawnItem(){
  if(!player) return;
  for(let t=0; t<30; t++){
    const a = rand(0, TAU), r = Math.sqrt(Math.random()) * (MAP_R - 400);
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    if(Math.hypot(x - player.x, y - player.y) < 300) continue;
    items.push({ x, y, type: 'shield', r: 14, phase: Math.random() * TAU });
    return;
  }
}

/* 渲染 */
function hexPath(cx, cy, s){
  for(let k=0; k<6; k++){
    const a = Math.PI/3*k + Math.PI/6;
    const x = cx + Math.cos(a)*s, y = cy + Math.sin(a)*s;
    if(k === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
}
function drawGrid(x0, y0, x1, y1){
  const s = 46, w = Math.sqrt(3)*s, h = 1.5*s;
  const r0 = Math.floor((y0-s)/h)-1, r1 = Math.ceil((y1+s)/h)+1;
  ctx.strokeStyle = 'rgba(120,150,220,.07)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  for(let row=r0; row<=r1; row++){
    const cy = row*h, off = (row & 1) ? w/2 : 0;
    const c0 = Math.floor((x0-off-s)/w)-1, c1 = Math.ceil((x1-off+s)/w)+1;
    for(let col=c0; col<=c1; col++) hexPath(col*w + off, cy, s);
  }
  ctx.stroke();
}
function drawBoundary(x0, y0, x1, y1){
  ctx.beginPath();
  ctx.rect(x0, y0, x1-x0, y1-y0);
  ctx.arc(0, 0, MAP_R, 0, TAU, true);
  ctx.fillStyle = 'rgba(150,20,30,.45)';
  ctx.fill('evenodd');

  ctx.beginPath();
  ctx.arc(0, 0, MAP_R, 0, TAU);
  ctx.strokeStyle = 'rgba(255,70,80,.25)';
  ctx.lineWidth = 16;
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,70,80,.95)';
  ctx.lineWidth = 5;
  ctx.stroke();
}
function drawFoods(x0, y0, x1, y1){
  const p = 24;
  const c0x = Math.floor((x0-p)/GRID), c1x = Math.floor((x1+p)/GRID);
  const c0y = Math.floor((y0-p)/GRID), c1y = Math.floor((y1+p)/GRID);
  for(let cy=c0y; cy<=c1y; cy++)
    for(let cx=c0x; cx<=c1x; cx++){
      const arr = foodGrid.get(cellKey(cx, cy));
      if(!arr) continue;
      for(let i=0; i<arr.length; i++){
        const f = arr[i];
        // ★ 终极防御：如果食物意外跑到边界外，跳过渲染
        if(Math.hypot(f.x, f.y) > MAP_R - 5) continue;
        const r = f.r * (1 + 0.18 * Math.sin(tNow*2.5 + f.phase));
        ctx.fillStyle = f.color;
        ctx.globalAlpha = 0.22;
        ctx.beginPath();
        ctx.arc(f.x, f.y, r * (f.big ? 2.6 : 2.1), 0, TAU);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.beginPath();
        ctx.arc(f.x, f.y, r, 0, TAU);
        ctx.fill();
      }
    }
}
function drawItems(){
  for(const it of items){
    const pulse = 1 + Math.sin(tNow*4 + it.phase) * 0.12;
    const r = it.r * pulse;
    ctx.beginPath();
    ctx.arc(it.x, it.y, r + 6, 0, TAU);
    ctx.fillStyle = 'rgba(74,144,217,.22)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(it.x, it.y, r, 0, TAU);
    ctx.fillStyle = '#4A90D9';
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(it.x, it.y - r*0.55);
    ctx.lineTo(it.x + r*0.5, it.y - r*0.25);
    ctx.lineTo(it.x + r*0.5, it.y + r*0.15);
    ctx.quadraticCurveTo(it.x + r*0.5, it.y + r*0.55, it.x, it.y + r*0.7);
    ctx.quadraticCurveTo(it.x - r*0.5, it.y + r*0.55, it.x - r*0.5, it.y + r*0.15);
    ctx.lineTo(it.x - r*0.5, it.y - r*0.25);
    ctx.closePath();
    ctx.fillStyle = '#fff';
    ctx.fill();
  }
}
function drawSnake(s, x0, y0, x1, y1){
  const bb = s.bbox;
  if(bb.maxX < x0 || bb.minX > x1 || bb.maxY < y0 || bb.minY > y1) return;

  const b = s.body, len = b.length;
  let lod = 1;
  if(len > 3000) lod = 12;
  else if(len > 2000) lod = 8;
  else if(len > 1000) lod = 6;
  else if(len > 500) lod = 4;
  else if(len > 200) lod = 3;
  else if(len > 60) lod = 2;

  ctx.globalAlpha = s.invincible > 0 ? (0.45 + 0.35*Math.sin(tNow*18)) : 1;

  if(s.boost && len > 1){
    ctx.beginPath();
    ctx.moveTo(b[0].x, b[0].y);
    for(let i=lod; i<len; i+=lod) ctx.lineTo(b[i].x, b[i].y);
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.28 + 0.15*Math.sin(tNow*20)) + ')';
    ctx.lineWidth = s.radius * 2 + 5;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  const rBase = s.radius * (lod > 1 ? lod * 0.78 : 1);
  for(let i = len - 1; i >= 0; i -= lod){
    const pt = b[i];
    if(pt.x < x0 || pt.x > x1 || pt.y < y0 || pt.y > y1) continue;
    ctx.fillStyle = s.color;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, rBase, 0, TAU);
    ctx.fill();
  }

  if(s.x > x0-80 && s.x < x1+80 && s.y > y0-80 && s.y < y1+80){
    const hr = s.headR;

    if(s.isPlayer && s.shield){
      const pulse = 1 + Math.sin(tNow*4)*0.1;
      ctx.beginPath();
      ctx.arc(s.x, s.y, hr*1.9*pulse, 0, TAU);
      ctx.strokeStyle = 'rgba(74,144,217,.7)';
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(s.x, s.y, hr*2.3*pulse, 0, TAU);
      ctx.strokeStyle = 'rgba(74,144,217,.3)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    if(s.isPlayer){
      const pr = EAT_PULL_BASE + s.radius * EAT_PULL_PER_R;
      ctx.beginPath();
      ctx.arc(s.x, s.y, pr, 0, TAU);
      ctx.strokeStyle = 'rgba(74,144,217,.09)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(s.x, s.y, hr, 0, TAU);
    ctx.fillStyle = s.color;
    ctx.fill();

    if(s.isPlayer){
      ctx.beginPath();
      ctx.arc(s.x, s.y, hr, 0, TAU);
      ctx.strokeStyle = 'rgba(74,144,217,.4)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    const ca = Math.cos(s.angle), sa = Math.sin(s.angle);
    const px = -sa, py = ca;
    const eyeOff = hr * 0.42, eyeFwd = hr * 0.32;
    const eyeR = Math.max(2.2, hr * 0.36);
    for(let e=1; e>=-1; e-=2){
      const ex = s.x + ca*eyeFwd + px*eyeOff*e;
      const ey = s.y + sa*eyeFwd + py*eyeOff*e;
      ctx.beginPath(); ctx.arc(ex, ey, eyeR, 0, TAU);
      ctx.fillStyle = '#fff'; ctx.fill();
      ctx.beginPath();
      ctx.arc(ex + ca*eyeR*0.35, ey + sa*eyeR*0.35, eyeR*0.55, 0, TAU);
      ctx.fillStyle = '#1a1a2e'; ctx.fill();
    }

    const ax = s.x + ca * hr * 1.9;
    const ay = s.y + sa * hr * 1.9;
    const aSize = hr * 0.75;
    ctx.beginPath();
    ctx.moveTo(ax + ca*aSize, ay + sa*aSize);
    ctx.lineTo(ax - ca*aSize*0.5 + px*aSize*0.7, ay - sa*aSize*0.5 + py*aSize*0.7);
    ctx.lineTo(ax - ca*aSize*0.5 - px*aSize*0.7, ay - sa*aSize*0.5 - py*aSize*0.7);
    ctx.closePath();
    ctx.fillStyle = 'rgba(74,144,217,.55)';
    ctx.fill();
  }

  ctx.globalAlpha = 1;
}
function drawMinimap(){
  const S = 110;
  mctx.setTransform(2, 0, 0, 2, 0, 0);
  mctx.clearRect(0, 0, S, S);
  const k = (S/2 - 3) / MAP_R;
  for(const s of snakes){
    if(s.dead) continue;
    mctx.fillStyle = s.isPlayer ? '#ffdd59' : 'rgba(255,255,255,.4)';
    mctx.beginPath();
    mctx.arc(S/2 + s.x*k, S/2 + s.y*k, s.isPlayer ? 3 : 1.6, 0, TAU);
    mctx.fill();
  }
  for(const it of items){
    mctx.beginPath();
    mctx.arc(S/2 + it.x*k, S/2 + it.y*k, 2.5, 0, TAU);
    mctx.fillStyle = '#4A90D9';
    mctx.fill();
  }
}

function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#0c1322';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.scale(zoom, zoom);
  ctx.translate(-cam.x, -cam.y);

  const vw = W / zoom / 2 + 60, vh = H / zoom / 2 + 60;
  const x0 = cam.x - vw, y0 = cam.y - vh;
  const x1 = cam.x + vw, y1 = cam.y + vh;

  drawGrid(x0, y0, x1, y1);
  drawBoundary(x0, y0, x1, y1);
  drawFoods(x0, y0, x1, y1);
  drawItems();
  for(const s of snakes) drawSnake(s, x0, y0, x1, y1);

  ctx.restore();
  drawMinimap();
}

function updateHUD(){
  if(!player) return;
  statLen.textContent = Math.round(player.length);
  statKill.textContent = player.kills;
  const sorted = snakes.filter(s => !s.dead).sort((a,b) => b.length - a.length);
  const rank = sorted.indexOf(player) + 1;
  statRank.textContent = rank > 0 ? '#' + rank : '#-';
  if(rank > 0 && rank < player.bestRank) player.bestRank = rank;
}

/* 输入 */
const input = { moveId: null, boostId: null, joyStartX: 0, joyStartY: 0, boost: false, keyBoost: false };

function moveJoy(dx, dy){
  const d = Math.hypot(dx, dy), m = Math.min(d, 45), k = d > 0 ? m/d : 0;
  joyKnob.style.transform = 'translate(calc(-50% + ' + (dx*k) + 'px), calc(-50% + ' + (dy*k) + 'px))';
}
function hideJoy(){ joyKnob.style.transform = 'translate(-50%,-50%)'; }
function setDir(dx, dy){
  if(Math.hypot(dx, dy) > 10 && player && !player.dead)
    player.targetAngle = Math.atan2(dy, dx);
}

joyBase.addEventListener('touchstart', e => {
  e.preventDefault();
  if(gameState !== 'play') return;
  const t = e.changedTouches[0];
  input.moveId = t.identifier;
  const r = joyBase.getBoundingClientRect();
  input.joyStartX = r.left + r.width/2;
  input.joyStartY = r.top + r.height/2;
  moveJoy(t.clientX - input.joyStartX, t.clientY - input.joyStartY);
  setDir(t.clientX - input.joyStartX, t.clientY - input.joyStartY);
}, { passive: false });

joyBase.addEventListener('touchmove', e => {
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier === input.moveId){
      const dx = t.clientX - input.joyStartX;
      const dy = t.clientY - input.joyStartY;
      moveJoy(dx, dy);
      setDir(dx, dy);
    }
  }
}, { passive: false });

function onJoyEnd(e){
  for(const t of e.changedTouches){
    if(t.identifier === input.moveId){
      input.moveId = null;
      hideJoy();
    }
  }
}
joyBase.addEventListener('touchend', onJoyEnd);
joyBase.addEventListener('touchcancel', onJoyEnd);

boostBtn.addEventListener('touchstart', e => {
  e.preventDefault();
  if(gameState !== 'play') return;
  input.boostId = e.changedTouches[0].identifier;
  input.boost = true;

}, { passive: false });

function onBoostEnd(e){

    if(t.identifier === input.boostId){
      input.boostId = null;
      input.boost = false;
      boostBtn.classList.remove('active');

}
boostBtn.addEventListener('touchend', onBoostEnd);

let mouseDown = false;

});
addEventListener('mousemove', e => {

});
addEventListener('keydown', e => {
  if(gameState !== 'play'){
    if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); startGame(); }
    return;
  }
  let a = null;
  if(e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') a = -Math.PI/2;
  else if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') a = 0;
  else if(e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') a = Math.PI/2;
  else if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') a = Math.PI;
  if(a != null){ e.preventDefault(); if(player) player.targetAngle = a; return; }
  if(e.key === 'Shift'){ input.boost = true; boostBtn.classList.add('active'); }
});
addEventListener('keyup', e => {
  if(e.key === 'Shift'){ input.boost = false; boostBtn.classList.remove('active'); }
});

function bindStart(el){
  const handler = e => { e.preventDefault(); initAudio(); startGame(); };
  el.addEventListener('click', handler);
  el.addEventListener('touchend', handler);
}
bindStart($('startBtn'));
bindStart($('retryBtn'));

let lastT = performance.now();
function frame(t){
  requestAnimationFrame(frame);
  let dt = (t - lastT) / 1000;
  lastT = t;
  if(dt > 0.05) dt = 0.05;
  if(dt < 0) dt = 0;

  update(dt);
  render();
}

setupMenuWorld();
requestAnimationFrame(frame);
</script>
</body>
</html>
